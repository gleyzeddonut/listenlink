# Build sanity check: every push must compile. Native arch only and unsigned —
# release builds (universal, signed, notarized) still happen locally.
name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DLL_CODESIGN_ID=""
          -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build
        run: cmake --build build -j 3
